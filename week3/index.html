    <header>
        <h1>김민규<img src="https://i.namu.wiki/i/L7GQ44yJSM_LJkzO0sPyaC456Ho3a4ECfY334BtShJeYJa76z1trc5suYBTjB95ZodxSdAH4xoECVz-p13Uv3n2rh38c5EC_I1OlEiMsNyXRiTwX4Iy1ZNH179t_VUQm6QKU1e5jsxfK6PYB2a8rHA.svg"width="100" alt="제주대 로고"></h1>

    <main>
        <section>
            <h2>문의하기</h2>

            <form>
                <div>
                    <label for="userName">이름: </label>
                    <input type="text" id="userName" name="userName" required placeholder="이름을 입력하세요.">
                </div>
                <br>
                
                <div>
                    <label for="userEmail">이메일: </label>
                    <input type="email" id="userEmail" name="userEmail" required placeholder="이메일을 입력하세요.">
                </div>
                <br>

                <div>=
                    <label for="inquiryType">문의 유형: </label>
                    <select id="inquiryType" name="inquiryType">
                        <option value="1" selected>유형1</option>
                        <option value="2">유형2</option>
                        <option value="3">유형3</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="inquiryContent">문의 내용: </label><br>
                    <textarea id="inquiryContent" name="inquiryContent" required placeholder="문의 내용을 입력하세요"></textarea>
                </div>
                <br>

                <div>
                    <button type="submit">보내기</button>
                </div>

            </form>
        </section>
    </main>
