<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이력서</title>
</head>
<body>
    <h1>김민규 이력서</h1>
    <h2>웹 개발자를 목표로 공부 중인 학생입니다.</h2>

    <p>안녕하세요. 제주대학교 재학생입니다.</p>
    <p>열심히 하겠습니다.</p>

    <h3>배우고 싶은 기술 스택</h3>
    <ul>
        <li>HTML5 / CSS3</li>
        <li>JavaScript</li>
        <li>React</li>
    </ul>

    <h3>학력 및 경력</h3>
    <table border="1">
        <caption>학력 및 활동 사항</caption>
        <thead>
            <tr>
                <th scope="col">구분</th>
                <th scope="col">기관 / 내용</th>
                <th scope="col">비고</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>학력</td>
                <td>제주대학교 재학</td>
                <td>컴퓨터공학 전공 (2024 ~ 현재)</td>
            </tr>
            <tr>
                <td>경력</td>
                <td>팀 프로젝트 진행</td>
                <td>웹 프로젝트 및 AI 탐지 프로그램 개발 (2026 ~ 현재)</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
